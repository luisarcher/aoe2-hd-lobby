services:
  aoe2hd:
    build: .
    image: aoe2-hd-lobby:latest
    hostname: aoe2hd
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      AOE_REFRESH_SECONDS: "${AOE_REFRESH_SECONDS:-15}"
    volumes:
      # holds steam_token.json: create it with
      #   docker compose run --rm lobby python login.py
      - ./data:/app/data
  
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=TUNNEL_TOKEN