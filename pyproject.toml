[project]
name = "aoe2-hd-lobby"
version = "0.1.0"
description = "Web lobby browser and matchmaking alerts for Age of Empires II: HD, straight from Steam."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # steam 1.4.4 pins protobuf 3.x; it is pure-python and works on 3.12/3.13
    "steam[client]==1.4.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
